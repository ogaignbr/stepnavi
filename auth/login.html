<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ログイン - STEP NAVI</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script>
tailwind.config = { theme: { extend: { colors: { brand: { 50:'#f0fdf4',100:'#dcfce7',200:'#bbf7d0',300:'#86efac',400:'#4ade80',500:'#22c55e',600:'#16a34a',700:'#15803d',800:'#166534' } },  fontFamily: { sans: ['Noto Sans JP','Inter','system-ui','sans-serif'], heading: ['Inter','Noto Sans JP','sans-serif'] } } } }
</script>
<style>
html { scroll-behavior: smooth; -webkit-tap-highlight-color: transparent }
body { -webkit-font-smoothing: antialiased; font-feature-settings: "palt" }
.fade-up { opacity: 0; transform: translateY(20px); transition: opacity .5s ease, transform .5s ease }
.fade-up.visible { opacity: 1; transform: none }
.input-field { width: 100%; padding: 13px 14px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 14px; color: #0f172a; background: #fff; transition: border-color .15s, box-shadow .15s }
.input-field:focus { outline: none; border-color: #16a34a; box-shadow: 0 0 0 3px rgba(22,163,74,.12) }
.input-field::placeholder { color: #cbd5e1 }
.btn-primary { width: 100%; padding: 14px; background: linear-gradient(135deg,#22c55e,#15803d); color: white; border-radius: 12px; font-size: 14px; font-weight: 700; box-shadow: 0 8px 20px -6px rgba(21,128,61,.45); transition: transform .15s, box-shadow .15s }
.btn-primary:active { transform: translateY(1px) scale(.99) }
.btn-primary:disabled { background: #cbd5e1; box-shadow: none; cursor: not-allowed }
body { background: linear-gradient(to bottom, #f0fdf4 0%, #f8fafc 38%, #f8fafc 100%) }
</style>
<link rel="stylesheet" href="../assets/desktop.css">
<script src="../assets/storage.js"></script>
</head>
<body class="text-slate-900 min-h-screen">

<div class="min-h-screen flex flex-col px-5 py-10">

  <!-- LOGO -->
  <div class="text-center mb-8 fade-up">
    <div class="inline-flex items-center gap-2.5 mb-2.5">
      <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center shadow-[0_8px_20px_-8px_rgba(21,128,61,.6)]">
        <i data-lucide="footprints" class="w-[19px] h-[19px] text-white"></i>
      </div>
      <span class="font-extrabold text-[19px] tracking-tight font-heading">STEP NAVI</span>
    </div>
    <p class="text-[12px] text-slate-500">あなたのキャリアを、<span class="text-brand-600 font-semibold">一歩前へ。</span></p>
  </div>

  <!-- CARD -->
  <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 fade-up">
    <h1 class="text-[18px] font-bold mb-1">ログイン</h1>
    <p class="text-[12px] text-slate-400 mb-6">アカウントにログインして学習を続けよう</p>

    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-[12px] font-semibold text-slate-700 mb-1.5">メールアドレス</label>
        <input type="email" id="email" required class="input-field" placeholder="example@email.com" autocomplete="email">
      </div>

      <div>
        <label class="block text-[12px] font-semibold text-slate-700 mb-1.5">パスワード</label>
        <input type="password" id="password" required class="input-field" placeholder="••••••••" autocomplete="current-password">
      </div>

      <div id="error-msg" class="hidden text-[11px] text-red-500 -mt-2"></div>

      <button type="submit" class="btn-primary mt-2">ログイン</button>
    </form>

    <div class="text-center mt-5">
      <a href="#" class="text-[11px] text-slate-400 hover:text-slate-600">パスワードを忘れた方はこちら</a>
    </div>
  </div>

  <!-- REGISTER -->
  <div class="text-center mt-6 fade-up">
    <p class="text-[12px] text-slate-500 mb-2">アカウントをお持ちでない方</p>
    <a href="register.html" class="inline-flex items-center gap-1.5 px-6 py-2.5 bg-white border border-brand-200 rounded-xl text-[13px] font-bold text-brand-700">新規登録はこちら<i data-lucide="arrow-right" class="w-3.5 h-3.5"></i></a>
  </div>

</div>

<script>
lucide.createIcons();
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => { if (entry.isIntersecting) { entry.target.classList.add('visible'); observer.unobserve(entry.target); } });
}, { threshold: 0.08 });
document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));

// 簡易ログイン処理（LocalStorageベース）
document.getElementById('login-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('error-msg');
  errEl.classList.add('hidden');

  const users = StepNaviStorage.getUsers();
  const normalizedEmail = email.toLowerCase();
  const user = users.find(u => String(u.email || '').toLowerCase() === normalizedEmail && u.password === password);

  if (!user) {
    errEl.textContent = 'メールアドレスまたはパスワードが正しくありません';
    errEl.classList.remove('hidden');
    return;
  }

  // セッション保存
  StepNaviStorage.ensureUserId(user);
  StepNaviStorage.saveUsers(users);
  StepNaviStorage.createSession(user);
  localStorage.removeItem('stepnavi_guest');

  window.location.href = 'mypage.html';
});
</script>
</body>
</html>
