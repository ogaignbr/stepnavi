<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>新規登録 - STEP NAVI</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script>
tailwind.config = { theme: { extend: { colors: { brand: { 50:'#f0fdf4',100:'#dcfce7',200:'#bbf7d0',300:'#86efac',400:'#4ade80',500:'#22c55e',600:'#16a34a',700:'#15803d',800:'#166534' } },  fontFamily: { sans: ['Noto Sans JP','Inter','system-ui','sans-serif'], heading: ['Inter','Noto Sans JP','sans-serif'] } } } }
</script>
<style>
html { scroll-behavior: smooth; -webkit-tap-highlight-color: transparent }
body { -webkit-font-smoothing: antialiased; font-feature-settings: "palt" }
.fade-up { opacity: 0; transform: translateY(20px); transition: opacity .5s ease, transform .5s ease }
.fade-up.visible { opacity: 1; transform: none }
.input-field { width: 100%; padding: 13px 14px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 14px; color: #0f172a; background: #fff; transition: border-color .15s, box-shadow .15s }
.input-field:focus { outline: none; border-color: #16a34a; box-shadow: 0 0 0 3px rgba(22,163,74,.12) }
.input-field::placeholder { color: #cbd5e1 }
select.input-field { appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 12px center; background-size: 16px; padding-right: 36px }
.btn-primary { width: 100%; padding: 14px; background: linear-gradient(135deg,#22c55e,#15803d); color: white; border-radius: 12px; font-size: 14px; font-weight: 700; box-shadow: 0 8px 20px -6px rgba(21,128,61,.45); transition: transform .15s, box-shadow .15s }
.btn-primary:active { transform: translateY(1px) scale(.99) }
.btn-primary:disabled { background: #cbd5e1; box-shadow: none; cursor: not-allowed }
.chip-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
.chip { position: relative }
.chip input { position: absolute; opacity: 0; pointer-events: none }
.chip-label { display: flex; align-items: center; justify-content: center; padding: 10px 8px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 12.5px; color: #475569; cursor: pointer; transition: all .15s; text-align: center; line-height: 1.4; min-height: 42px }
.chip input:checked + .chip-label { background: #f0fdf4; color: #15803d; border-color: #16a34a; font-weight: 700 }
.chip input:focus-visible + .chip-label { box-shadow: 0 0 0 3px rgba(22,163,74,.18) }
body { background: linear-gradient(to bottom, #f0fdf4 0%, #f8fafc 30%, #f8fafc 100%) }
</style>
<link rel="stylesheet" href="../assets/desktop.css">
<script src="../assets/storage.js"></script>
</head>
<body class="text-slate-900 min-h-screen">

<div class="min-h-screen flex flex-col px-5 py-10">

  <!-- LOGO -->
  <div class="text-center mb-8 fade-up">
    <div class="inline-flex items-center gap-2.5 mb-2.5">
      <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center shadow-[0_8px_20px_-8px_rgba(21,128,61,.6)]">
        <i data-lucide="footprints" class="w-[19px] h-[19px] text-white"></i>
      </div>
      <span class="font-extrabold text-[19px] tracking-tight font-heading">STEP NAVI</span>
    </div>
    <p class="text-[12px] text-slate-500">あなたのキャリアを、<span class="text-brand-600 font-semibold">一歩前へ。</span></p>
  </div>

  <!-- CARD -->
  <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 fade-up">
    <h1 class="text-[18px] font-bold mb-1">新規登録</h1>
    <p class="text-[12px] text-slate-400 mb-6">かんたん入力で学習をスタート</p>

    <form id="register-form" class="space-y-4">
      <div>
        <label class="block text-[12px] font-semibold text-slate-700 mb-1.5">お名前</label>
        <input type="text" id="nickname" required class="input-field" placeholder="例：山田 太郎" maxlength="40" autocomplete="name">
      </div>

      <div>
        <label class="block text-[12px] font-semibold text-slate-700 mb-1.5">メールアドレス</label>
        <input type="email" id="email" required class="input-field" placeholder="example@email.com" autocomplete="email">
      </div>

      <div>
        <label class="block text-[12px] font-semibold text-slate-700 mb-1.5">パスワード</label>
        <input type="password" id="password" required class="input-field" placeholder="6文字以上" minlength="6" autocomplete="new-password">
      </div>

      <div>
        <label class="block text-[12px] font-semibold text-slate-700 mb-1.5">希望職種</label>
        <select id="job-type" required class="input-field">
          <option value="">選択してください</option>
          <option value="office">一般事務</option>
          <option value="sales">販売・接客</option>
          <option value="construction">施工管理・現業</option>
          <option value="business">営業</option>
          <option value="it">IT・エンジニア</option>
          <option value="care">介護・福祉</option>
          <option value="manufacturing">製造</option>
          <option value="logistics">運輸・物流</option>
          <option value="other">その他・未定</option>
        </select>
      </div>

      <div>
        <label class="block text-[12px] font-semibold text-slate-700 mb-1.5">興味のある分野 <span class="text-slate-400 font-normal">（複数選択OK）</span></label>
        <div class="chip-grid">
          <label class="chip"><input type="checkbox" name="interests" value="pc-skill"><span class="chip-label">パソコンスキル</span></label>
          <label class="chip"><input type="checkbox" name="interests" value="mos"><span class="chip-label">MOS資格</span></label>
          <label class="chip"><input type="checkbox" name="interests" value="generative-ai"><span class="chip-label">生成AI</span></label>
          <label class="chip"><input type="checkbox" name="interests" value="ai-passport"><span class="chip-label">AIパスポート</span></label>
          <label class="chip"><input type="checkbox" name="interests" value="side-job"><span class="chip-label">副業</span></label>
          <label class="chip"><input type="checkbox" name="interests" value="interview"><span class="chip-label">面接対策</span></label>
          <label class="chip"><input type="checkbox" name="interests" value="resume"><span class="chip-label">履歴書作成</span></label>
          <label class="chip"><input type="checkbox" name="interests" value="business-manner"><span class="chip-label">ビジネスマナー</span></label>
          <label class="chip"><input type="checkbox" name="interests" value="reskilling"><span class="chip-label">リスキリング</span></label>
          <label class="chip"><input type="checkbox" name="interests" value="career-change"><span class="chip-label">転職全般</span></label>
        </div>
      </div>

      <div id="error-msg" class="hidden text-[11px] text-red-500 -mt-2"></div>

      <button type="submit" class="btn-primary mt-2">登録する</button>
    </form>

    <p class="text-[10px] text-slate-400 mt-4 leading-[1.7]">登録すると、利用規約とプライバシーポリシーに同意したものとみなします。</p>
  </div>

  <!-- LOGIN -->
  <div class="text-center mt-6 fade-up">
    <p class="text-[12px] text-slate-500 mb-2">すでにアカウントをお持ちの方</p>
    <a href="login.html" class="inline-flex items-center gap-1.5 px-6 py-2.5 bg-white border border-brand-200 rounded-xl text-[13px] font-bold text-brand-700">ログインへ<i data-lucide="arrow-right" class="w-3.5 h-3.5"></i></a>
  </div>

</div>

<script src="config.js"></script>
<script>
lucide.createIcons();
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => { if (entry.isIntersecting) { entry.target.classList.add('visible'); observer.unobserve(entry.target); } });
}, { threshold: 0.08 });
document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));

async function sendRegistrationToSheets(payload) {
  const endpoint = window.STEPNAVI_CONFIG && window.STEPNAVI_CONFIG.SHEETS_ENDPOINT;
  if (!endpoint) return;

  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 8000);
  try {
    await fetch(endpoint, {
      method: 'POST',
      mode: 'no-cors',
      cache: 'no-store',
      credentials: 'omit',
      keepalive: true,
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload),
      signal: controller.signal
    });
  } finally {
    clearTimeout(timeoutId);
  }
}

// 簡易登録処理
document.getElementById('register-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.currentTarget;
  const submitBtn = form.querySelector('button[type="submit"]');
  const nickname = document.getElementById('nickname').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const jobType = document.getElementById('job-type').value;
  const interests = Array.from(document.querySelectorAll('input[name="interests"]:checked')).map(i => i.value);
  const errEl = document.getElementById('error-msg');
  errEl.classList.add('hidden');

  const users = StepNaviStorage.getUsers();
  const normalizedEmail = email.toLowerCase();

  if (users.some(u => String(u.email || '').toLowerCase() === normalizedEmail)) {
    errEl.textContent = 'このメールアドレスは既に登録されています';
    errEl.classList.remove('hidden');
    return;
  }

  const registeredAt = new Date().toISOString();
  const user = {
    userId: StepNaviStorage.makeUserId(email),
    email,
    password,
    nickname,
    jobType,
    interests,
    registeredAt
  };

  submitBtn.disabled = true;
  submitBtn.textContent = '登録中...';

  try {
    await sendRegistrationToSheets({
      userId: user.userId,
      registeredAt,
      nickname,
      email,
      jobType,
      interests: interests.join(','),
      sourceUrl: location.href
    });
  } catch(_) {
    errEl.textContent = 'スプレッドシートへの登録送信に失敗しました。通信環境を確認してもう一度お試しください。';
    errEl.classList.remove('hidden');
    submitBtn.disabled = false;
    submitBtn.textContent = '登録する';
    return;
  }

  users.push(user);
  StepNaviStorage.saveUsers(users);
  StepNaviStorage.createSession(user, registeredAt);
  localStorage.removeItem('stepnavi_guest');

  window.location.href = 'mypage.html';
});

</script>
</body>
</html>
