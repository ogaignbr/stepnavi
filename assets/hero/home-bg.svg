<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3fdf6"/>
      <stop offset="0.5" stop-color="#dcfce7"/>
      <stop offset="1" stop-color="#a7f3d0"/>
    </linearGradient>
    <radialGradient id="sun" cx="76%" cy="20%" r="55%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#fefce8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fefce8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="42%" r="78%">
      <stop offset="0.55" stop-color="#064e3b" stop-opacity="0"/>
      <stop offset="1" stop-color="#064e3b" stop-opacity="0.14"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="15"/></filter>
  </defs>

  <!-- base sky-to-field gradient -->
  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- soft, defocused foliage / hills -->
  <g filter="url(#soft)">
    <ellipse cx="150" cy="475" rx="340" ry="160" fill="#86efac" opacity="0.7"/>
    <ellipse cx="660" cy="505" rx="380" ry="180" fill="#4ade80" opacity="0.55"/>
    <ellipse cx="430" cy="540" rx="440" ry="170" fill="#16a34a" opacity="0.32"/>
    <ellipse cx="40" cy="300" rx="150" ry="220" fill="#34d399" opacity="0.28"/>
    <ellipse cx="790" cy="340" rx="170" ry="240" fill="#22c55e" opacity="0.26"/>
  </g>

  <!-- warm sun glow -->
  <rect width="800" height="500" fill="url(#sun)"/>

  <!-- defocused bokeh light orbs -->
  <g filter="url(#soft2)">
    <circle cx="600" cy="115" r="36" fill="#ffffff" opacity="0.5"/>
    <circle cx="694" cy="178" r="22" fill="#ffffff" opacity="0.4"/>
    <circle cx="538" cy="86" r="15" fill="#ecfccb" opacity="0.6"/>
    <circle cx="118" cy="140" r="28" fill="#ffffff" opacity="0.32"/>
    <circle cx="250" cy="104" r="13" fill="#ffffff" opacity="0.4"/>
    <circle cx="726" cy="298" r="42" fill="#bbf7d0" opacity="0.42"/>
    <circle cx="360" cy="150" r="10" fill="#ffffff" opacity="0.35"/>
    <circle cx="470" cy="210" r="18" fill="#d9f99d" opacity="0.3"/>
  </g>

  <!-- vignette for photographic depth -->
  <rect width="800" height="500" fill="url(#vig)"/>
</svg>
